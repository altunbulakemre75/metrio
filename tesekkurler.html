<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Teşekkürler — Metrio</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="6;url=index.html">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 7h17l9 9-9 9H3z' fill='%23FFD21F' stroke='%23121417' stroke-width='2.5' stroke-linejoin='round'/%3E%3Ccircle cx='20' cy='16' r='2.6' fill='%23121417'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=JetBrains+Mono:wght@400&family=Rethink+Sans:wght@400;600&display=swap">
  <style>
    :root {
      --paper: #F2F3F5; --card: #FFFFFF; --ink: #121417; --muted: #59606A; --line: #D9DCE1;
      --tag: #FFD21F; --tag-ink: #121417; --link: #2350C8;
      --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
      --f-body: "Rethink Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #0F1114; --card: #181B20; --ink: #ECEEF1; --muted: #9BA2AC; --line: #2B3038; --link: #8EB2FF; color-scheme: dark; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--f-body);
      font-size: 17px;
      line-height: 1.6;
      display: grid;
      place-items: center;
      padding-block: 32px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    .card {
      max-width: 30rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 40px 32px;
      display: grid;
      gap: 18px;
      justify-items: start;
    }
    .card svg { width: 44px; height: 44px; }
    h1 { font-family: var(--f-display); font-weight: 800; font-stretch: 72%; font-size: 2.6rem; line-height: 1; margin: 0; }
    p { margin: 0; color: var(--muted); }
    .btn {
      display: inline-flex; align-items: center;
      background: var(--tag); color: var(--tag-ink);
      border: 2px solid var(--tag-ink); border-radius: 6px;
      box-shadow: 3px 3px 0 var(--ink);
      padding: 11px 18px; font-weight: 600; text-decoration: none;
    }
    .btn:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
    .redirect { font-family: var(--f-mono); font-size: 0.75rem; }
  </style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 7h17l9 9-9 9H3z" fill="#FFD21F" stroke="#121417" stroke-width="2.5" stroke-linejoin="round"/><circle cx="20" cy="16" r="2.6" fill="#121417"/></svg>
    <h1>Talebinizi aldık.</h1>
    <p>24 saat içinde size dönüyoruz, çoğu zaman daha erken. Acil bir şey varsa WhatsApp'tan yazabilirsiniz: +90 537 658 84 70</p>
    <a href="index.html" class="btn">Ana sayfaya dön</a>
    <p class="redirect">6 saniye içinde ana sayfaya yönlendirileceksiniz.</p>
  </main>
</body>
</html>
